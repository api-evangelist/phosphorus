apis:
- name: Phosphorus API
  description: >-
    REST API for the Phosphorus xIoT security platform, spanning two live versions. The v2 surface reads devices and
    their alerts, certificates, credentials, data provenance, firmware, logs and scans, plus sites, tenant-wide alerts,
    and a cross-entity search endpoint. The v3 surface manages dynamic scan configurations, integration providers and
    their health checks and credentials, excluded devices, and secrets in the Phosphorus Vault. Every operation is
    authenticated with an X-API-KEY header. The API is deployed per tenant, so the base URL is the customer's own
    Phosphorus instance hostname; Phosphorus does not publish a public API reference or developer portal, and the
    human-readable documentation sits behind the customer support portal.
  humanURL: https://phosphorus.io/platform/
  baseURL: https://{tenant}.phosphorus.io
