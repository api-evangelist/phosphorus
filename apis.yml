aid: phosphorus
name: Phosphorus
description: >-
  Phosphorus Cybersecurity is a Nashville, Tennessee cyber-physical systems (CPS) security company founded in 2017 by
  Chris Rouland, Earle Ady and Rebecca Rouland, and acquired by Dragos on 1 June 2026. Its agentless xIoT platform
  discovers, assesses, hardens and remediates IoT, OT, IIoT and IoMT devices across enterprise and critical
  infrastructure networks, automating credential rotation, firmware updates, certificate management, and vulnerability
  assessment at scale without additional hardware or endpoint agents. The platform exposes a customer-facing REST API
  (v2 and v3) described by an OpenAPI 3.0.0 contract that Phosphorus serves from each tenant instance at
  /api/swagger/public/swagger.json, covering devices, alerts, firmware, certificates, credentials, sites, search,
  dynamic scans, integration providers, and the Phosphorus Vault, authenticated with an X-API-KEY request header.
