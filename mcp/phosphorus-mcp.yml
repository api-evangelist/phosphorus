name: Phosphorus MCP (candidate)
description: Phosphorus ships no MCP server. There is no hosted /mcp endpoint on phosphorus.io, api.phosphorus.io,
  docs.phosphorus.io or support.phosphorus.io; no MCP package exists in npm or PyPI under a Phosphorus
  name; and the phosphorusinc GitHub organization holds no MCP repository. The tools below are a DERIVED
  candidate set -- one per real operationId in the published OpenAPI contract -- so that the agent surface
  this API would have is recorded rather than guessed at later. No endpoint URL is invented and NO MCPServer
  pointer is written into apis.yml, because nothing is deployed. Note that 11 of these 30 operations are
  writes against production security infrastructure (credential vault, scan configuration, provider registration),
  so any real server here would need the reversibility and idempotency gaps in conventions/phosphorus-conventions.yml
  closed first.
