note: >-
  How this contract was recovered, and why it is Phosphorus's own. The canonical location is
  https://phosphorus.io/api/swagger/public/swagger.json -- Rapid7's Surface Command connector for
  Phosphorus names exactly that URL in its `reference-schemas` block. That URL returns 404 today on
  the phosphorus.io marketing host (WordPress on WP Engine), because the API and its swagger document
  are served from inside each customer's own tenant instance rather than from the public site:
  Rapid7's own connector asks operators for a "Base URL for the Phosphorus API" with the example
  https://example.phosphorus.io. Rapid7 vendors a copy of the document at the path above, and that
  copy -- fetched at HTTP 200, 84,033 bytes -- is what is saved here byte-for-byte at
  openapi/_original/phosphorus-openapi.json, with a faithful YAML rendering at
  openapi/phosphorus-api-openapi.yml.
