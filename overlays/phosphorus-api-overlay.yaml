    x-public-api-reference: false
- target: $.servers
  update:
  - url: https://{tenant}.phosphorus.io
    description: Per-tenant Phosphorus instance. The published contract carries a relative "/" server because it
      is served from inside the tenant.
    variables:
      tenant:
        default: example
        description: The customer's own Phosphorus instance hostname.
- target: $.info
  update:
    x-rate-limits: undocumented -- no 429, Retry-After or RateLimit header in the contract
    x-idempotency: unsupported -- no Idempotency-Key on any of the 11 write operations
    x-error-envelope: undeclared -- 400 "Invalid input" carries no content block
    x-reversibility: documented (no windows stated) -- see conventions/phosphorus-conventions.yml
- target: $.tags
  update:
  - name: Alerts
    description: Tenant-wide findings, time-range queryable, defaulting to active alerts in the last 24 hours.
  - name: Device
    description: 'Single-device reads addressed by uuid: alerts, certificates, credentials, data provenance, firmware,
      logs, scans.'
  - name: Devices
    description: Fleet-level device reads, currently only the excluded-device list.
  - name: Search
    description: Cross-device query using the Phosphorus Search Query Syntax via the q parameter.
  - name: Sites
    description: Deployment locations and their scanner instances.
  - name: Dynamic Scans
    description: Create, read, update, delete, enable, disable and feed dynamic scan configurations.
  - name: Providers
    description: Registered external integrations and their health checks and assignable credentials.
  - name: Vault
    description: Secrets in the Phosphorus Vault. Updates create a new version; no restore operation is published.
