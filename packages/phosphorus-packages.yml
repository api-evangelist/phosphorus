note: >-
  Phosphorus publishes NO first-party client library in any public registry. The three name matches
  found (npm "phosphorus", PyPI "phosphorus", RubyGems "phosphorus") are unrelated projects that
  happen to share the element name -- the PyPI one is a PEP 621 build backend -- and none is
  authored by Phosphorus Cybersecurity. The phosphorusinc GitHub org holds six repositories, of
  which four are forks or infrastructure (react-native, AndroidNetworkTools, docker-php-nginx,
  composer-local-dev) and two are first-party but not SDKs (public, phosphorus_ebpf_stats). The
  Phosphorus API is therefore consumed either directly over HTTP with an X-API-KEY header or
  through a third-party connector (Rapid7 Surface Command, Microsoft Sentinel, ServiceNow, CyberArk,
  Axonius, Check Point). No `SDKs` pointer is emitted, because there is no SDK.
